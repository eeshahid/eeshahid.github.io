- title: Selected Funded Research Projects
  type: time_table
  contents:
    - title: Physics-Informed Data Preparation and Efficient Diffusion Modelling for High-Fidelity Medical Imaging
      institution: SDAIA-KFUPM Joint Research Center for AI
      year: Ongoing
      description:
        - Developing physics-guided diffusion architectures incorporating imaging operators (e.g., PSF, attenuation, noise models) for improved reconstruction fidelity and robustness.
        - Designing computationally efficient diffusion models using few-step sampling, lightweight backbones, knowledge distillation, and quantization for real-time and edge deployment.
    - title: Spatio-Temporal Deep Learning for Robust and Efficient Face Presentation Attack Detection
      institution: SDAIA-KFUPM Joint Research Center for AI
      year: Ongoing
      description:
        - Developed spatio-temporal deep learning frameworks with squeeze-and-excitation and Bahdanau attention mechanisms for robust face anti-spoofing under real-world conditions.
        - Proposed multi-modal architectures augmenting RGB with synthetic depth modalities, achieving state-of-the-art performance with near-zero error rates on benchmark datasets.
    - title: "Provoking LLMs by LLMs: A Red Team Framework for Proactive Detection of Harmful Content"
      institution: SDAIA-KFUPM Joint Research Center for AI
      year: Completed
      description:
        - Investigated red teaming strategies for LLMs to proactively identify vulnerabilities and harmful behaviors, and contributed to evaluation frameworks for robustness, safety, and trustworthiness.
    - title: Development of Non-Visual Information Transmission Interfaces for the Blind and Visually Impaired
      institution: Sungkyunkwan University
      year: Completed
      description:
        - Developed a reconfigurable tactile platform as an assistive device for non-visual information transmission.
        - Developed the AI-Ekphrasis framework using transformer-based foundation models for multi-modal image and fine-grained text retrieval.
    - title: Development of Robustness and Precision Improvement Technologies in Complex Indoor Location Estimation
      institution: Sungkyunkwan University
      year: Completed
      description:
        - Developed and tested machine and deep learning-based solutions for robust indoor positioning and navigation, including an LSTM-based heading distance/direction estimator with 0.782 m mean error.

